<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CycleQuest 数据编辑器</title>
<style>
:root {
  --bg: #f5f5f7;
  --panel: #ffffff;
  --border: #e5e5ea;
  --border-strong: #d1d1d6;
  --text: #1d1d1f;
  --muted: #86868b;
  --accent: #007aff;
  --accent-light: rgba(0,122,255,0.10);
  --success: #34c759;
  --danger: #ff3b30;
  --hover: #f0f0f4;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* ============ 顶栏 ============ */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.brand .logo { font-size: 18px; }
.brand .title { font-size: 15px; }

.file-info {
  flex: 1;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  padding: 0 12px;
}

.actions { display: flex; align-items: center; gap: 8px; }

.dirty-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.2s;
}
.dirty-dot.show { opacity: 1; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.btn {
  padding: 6px 14px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn.primary:hover { background: #0066d6; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============ 主布局 ============ */
.main { display: flex; flex: 1; overflow: hidden; }

/* ============ 侧边栏 ============ */
.sidebar {
  width: 264px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 6px 0 16px;
  flex-shrink: 0;
}
.group { margin-bottom: 2px; }
.group-title {
  padding: 12px 16px 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.group-title .count {
  background: var(--bg);
  color: var(--muted);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  margin-left: auto;
  letter-spacing: 0;
  font-weight: 600;
}

.period-item {
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.12s;
  border-left: 3px solid transparent;
}
.period-item:hover { background: var(--hover); }
.period-item.active {
  background: var(--accent-light);
  border-left-color: var(--accent);
}
.period-main {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 5px;
  gap: 8px;
}
.period-label {
  font-size: 13px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.period-rate {
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.period-rate.full { color: var(--success); font-weight: 600; }

.mini-bar {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.mini-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* ============ 内容区 ============ */
.content { flex: 1; overflow-y: auto; padding: 24px 32px 40px; }

.content-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
  gap: 16px;
}
.content-header h2 {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 4px;
}
.content-header .sub {
  font-size: 13px;
  color: var(--muted);
}

.btn.subtle {
  border-color: transparent;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  padding: 5px 10px;
}
.btn.subtle:hover { background: #ffe5e5; color: var(--danger); }

/* ============ 任务列表 ============ */
.task-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.task-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.task-row:hover { border-color: var(--border-strong); }
.task-row.done .task-text { color: var(--muted); text-decoration: line-through; }

.checkbox {
  width: 20px; height: 20px;
  border: 2px solid var(--border-strong);
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  transition: all 0.15s;
  background: #fff;
}
.checkbox:hover { border-color: var(--accent); }
.checkbox.checked {
  background: var(--success);
  border-color: var(--success);
}
.checkbox.checked::after {
  content: '';
  position: absolute;
  left: 5px; top: 1px;
  width: 5px; height: 10px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.task-text {
  flex: 1;
  font-size: 14px;
  line-height: 1.5;
  outline: none;
  padding: 2px 6px;
  border-radius: 5px;
  word-break: break-word;
  transition: background 0.15s;
  min-height: 22px;
}
.task-text:hover { background: rgba(0,0,0,0.03); }
.task-text:focus { background: var(--accent-light); }

.del-btn {
  width: 26px; height: 26px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0;
  transition: all 0.15s;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}
.task-row:hover .del-btn { opacity: 1; }
.del-btn:hover { background: #ffe5e5; color: var(--danger); }

.add-task-btn {
  padding: 10px 16px;
  border: 1px dashed var(--border-strong);
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  width: 100%;
  transition: all 0.15s;
  font-family: inherit;
}
.add-task-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}

.empty, .empty-small {
  text-align: center;
  color: var(--muted);
  padding: 60px 20px;
  font-size: 14px;
}
.empty-small { padding: 24px; font-size: 13px; }

/* ============ Toast ============ */
#toastContainer {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 9999;
  pointer-events: none;
}
.toast {
  padding: 10px 16px;
  background: #1d1d1f;
  color: #fff;
  border-radius: 8px;
  font-size: 13px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.22);
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.25s ease;
  max-width: 380px;
  word-break: break-word;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: #1a7a3a; }
.toast.error { background: #b3261e; }

/* ============ 滚动条 ============ */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: #d1d1d6;
  border-radius: 4px;
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: #b0b0b5; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">✎</span>
    <span class="title">CycleQuest 数据编辑器</span>
  </div>
  <div class="file-info" id="fileInfo">加载中…</div>
  <div class="actions">
    <span class="dirty-dot" id="dirtyDot" title="有未保存的修改"></span>
    <button class="btn" id="btnBackup">备份</button>
    <button class="btn primary" id="btnSave">保存</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="content" id="content">
    <div class="empty">加载中…</div>
  </section>
</div>

<div id="toastContainer"></div>

<script>
(function () {
  'use strict';

  // ==================== 状态 ====================
  const state = {
    data: {},      // key -> { period, quests: [...] }
    unparsed: {},  // key -> 原始字符串（解析失败时保留）
    current: null,
    dirty: false,
    initialized: false,
  };

  const META = {
    daily:   { label: '每日', icon: '📅' },
    weekly:  { label: '每周', icon: '📆' },
    monthly: { label: '每月', icon: '🗓️' },
  };

  // ==================== 工具函数 ====================
  function pad(n) { return String(n).padStart(2, '0'); }

  function periodSortValue(scope, period) {
    if (scope === 'daily') {
      const p = period.split('-').map(Number);
      if (p.length === 3) return p[0] * 10000 + p[1] * 100 + p[2];
    }
    if (scope === 'weekly') {
      const m = period.match(/^(\d{4})-(\d{2})_W(\d+)$/);
      if (m) return parseInt(m[1]) * 10000 + parseInt(m[2]) * 100 + parseInt(m[3]);
    }
    if (scope === 'monthly') {
      const m = period.match(/^(\d{4})-(\d{2})$/);
      if (m) return parseInt(m[1]) * 10000 + parseInt(m[2]) * 100;
    }
    return 0;
  }

  function formatPeriod(scope, period) {
    if (scope === 'daily') {
      const p = period.split('-').map(Number);
      if (p.length === 3) {
        const d = new Date(p[0], p[1] - 1, p[2]);
        const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
        return `${p[1]}月${p[2]}日 周${wd}`;
      }
    }
    if (scope === 'weekly') {
      const m = period.match(/^(\d{4})-(\d{2})_W(\d+)$/);
      if (m) return `${m[1]}年${parseInt(m[2])}月 第${m[3]}周`;
    }
    if (scope === 'monthly') {
      const m = period.match(/^(\d{4})-(\d{2})$/);
      if (m) return `${m[1]}年${parseInt(m[2])}月`;
    }
    return period;
  }

  function markDirty() {
    state.dirty = true;
    document.getElementById('dirtyDot').classList.add('show');
  }

  function clearDirty() {
    state.dirty = false;
    document.getElementById('dirtyDot').classList.remove('show');
  }

  function showToast(msg, type) {
    const box = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast' + (type ? ' ' + type : '');
    t.textContent = msg;
    box.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => {
      t.classList.remove('show');
      setTimeout(() => t.remove(), 300);
    }, 2600);
  }

  // ==================== 侧边栏渲染 ====================
  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    const scrollTop = sidebar.scrollTop;

    const groups = { daily: [], weekly: [], monthly: [] };
    for (const key of Object.keys(state.data)) {
      const m = key.match(/^quest_(daily|weekly|monthly)_v4_(.+)$/);
      if (!m) continue;
      groups[m[1]].push({ key, period: m[2] });
    }

    sidebar.innerHTML = '';

    for (const scope of ['daily', 'weekly', 'monthly']) {
      const list = groups[scope].sort(
        (a, b) => periodSortValue(scope, b.period) - periodSortValue(scope, a.period)
      );
      if (list.length === 0) continue;

      const section = document.createElement('div');
      section.className = 'group';

      const title = document.createElement('div');
      title.className = 'group-title';
      title.innerHTML = `${META[scope].icon} ${META[scope].label}
        <span class="count">${list.length}</span>`;
      section.appendChild(title);

      for (const item of list) {
        const quests = (state.data[item.key].quests) || [];
        const done = quests.filter(q => q.done).length;
        const total = quests.length;
        const pct = total ? Math.round(done / total * 100) : 0;

        const el = document.createElement('div');
        el.className = 'period-item' + (state.current === item.key ? ' active' : '');
        el.dataset.key = item.key;

        const main = document.createElement('div');
        main.className = 'period-main';

        const label = document.createElement('span');
        label.className = 'period-label';
        label.textContent = formatPeriod(scope, item.period);

        const rate = document.createElement('span');
        rate.className = 'period-rate' + (pct === 100 && total > 0 ? ' full' : '');
        rate.textContent = `${done}/${total}`;

        main.appendChild(label);
        main.appendChild(rate);

        const bar = document.createElement('div');
        bar.className = 'mini-bar';
        const fill = document.createElement('div');
        fill.className = 'mini-fill';
        fill.style.width = pct + '%';
        bar.appendChild(fill);

        el.appendChild(main);
        el.appendChild(bar);
        el.onclick = () => selectKey(item.key);
        section.appendChild(el);
      }

      sidebar.appendChild(section);
    }

    sidebar.scrollTop = scrollTop;
  }

  // ==================== 内容区渲染 ====================
  function selectKey(key) {
    state.current = key;
    document.querySelectorAll('.period-item').forEach(el => {
      el.classList.toggle('active', el.dataset.key === key);
    });
    renderContent();
  }

  function renderContent() {
    const content = document.getElementById('content');
    const key = state.current;

    if (!key || !state.data[key]) {
      content.innerHTML = '<div class="empty">请从左侧选择一个周期</div>';
      return;
    }

    const m = key.match(/^quest_(daily|weekly|monthly)_v4_(.+)$/);
    if (!m) {
      content.innerHTML = '<div class="empty">该记录格式不支持编辑</div>';
      return;
    }
    const scope = m[1];
    const period = m[2];
    const data = state.data[key];
    const quests = data.quests || [];
    const done = quests.filter(q => q.done).length;
    const total = quests.length;
    const pct = total ? Math.round(done / total * 100) : 0;

    content.innerHTML = '';

    // 头部
    const header = document.createElement('div');
    header.className = 'content-header';

    const left = document.createElement('div');
    const h2 = document.createElement('h2');
    h2.textContent = formatPeriod(scope, period);
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = `${META[scope].icon} ${META[scope].label} · ${done}/${total} 已完成 · ${pct}%`;
    left.appendChild(h2);
    left.appendChild(sub);

    const rightBox = document.createElement('div');
    const delBtn = document.createElement('button');
    delBtn.className = 'btn subtle';
    delBtn.textContent = '删除该周期';
    delBtn.onclick = () => handleDeletePeriod(delBtn, key);
    rightBox.appendChild(delBtn);

    header.appendChild(left);
    header.appendChild(rightBox);
    content.appendChild(header);

    // 任务列表
    const list = document.createElement('div');
    list.className = 'task-list';

    if (quests.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-small';
      empty.textContent = '该周期暂无任务';
      list.appendChild(empty);
    } else {
      quests.forEach(q => list.appendChild(createTaskRow(q, key)));
    }
    content.appendChild(list);

    // 添加任务
    const addBtn = document.createElement('button');
    addBtn.className = 'add-task-btn';
    addBtn.textContent = '＋ 添加任务';
    addBtn.onclick = () => addTask(key);
    content.appendChild(addBtn);
  }

  function createTaskRow(q, key) {
    const row = document.createElement('div');
    row.className = 'task-row' + (q.done ? ' done' : '');
    row.dataset.id = q.id;

    // 复选框
    const cb = document.createElement('div');
    cb.className = 'checkbox' + (q.done ? ' checked' : '');
    cb.onclick = () => {
      q.done = !q.done;
      markDirty();
      row.classList.toggle('done', q.done);
      cb.classList.toggle('checked', q.done);
      refreshStats(key);
    };

    // 文本（可编辑）
    const txt = document.createElement('div');
    txt.className = 'task-text';
    txt.contentEditable = 'true';
    txt.spellcheck = false;
    txt.textContent = q.text;
    txt.dataset.original = q.text;

    txt.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        txt.blur();
      } else if (e.key === 'Escape') {
        txt.textContent = txt.dataset.original;
        txt.blur();
      }
    });

    txt.addEventListener('blur', () => {
      const newText = (txt.textContent || '').trim();
      if (!newText) {
        // 空内容回退
        txt.textContent = txt.dataset.original;
        return;
      }
      if (newText !== q.text) {
        q.text = newText;
        txt.dataset.original = newText;
        txt.textContent = newText;
        markDirty();
      }
    });

    // 删除按钮
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '×';
    del.title = '删除任务';
    del.onclick = () => {
      const d = state.data[key];
      d.quests = (d.quests || []).filter(x => x.id !== q.id);
      markDirty();
      renderContent();
      renderSidebar();
    };

    row.appendChild(cb);
    row.appendChild(txt);
    row.appendChild(del);
    return row;
  }

  // 只刷新头部统计 + 侧边栏当前项的进度
  function refreshStats(key) {
    const data = state.data[key];
    if (!data) return;
    const quests = data.quests || [];
    const done = quests.filter(q => q.done).length;
    const total = quests.length;
    const pct = total ? Math.round(done / total * 100) : 0;

    // 更新内容区头部
    const sub = document.querySelector('.content-header .sub');
    if (sub && state.current === key) {
      const m = key.match(/^quest_(daily|weekly|monthly)_v4_/);
      const scope = m ? m[1] : 'daily';
      sub.textContent = `${META[scope].icon} ${META[scope].label} · ${done}/${total} 已完成 · ${pct}%`;
    }

    // 更新侧边栏
    const el = document.querySelector(`.period-item[data-key="${cssEscape(key)}"]`);
    if (el) {
      const rate = el.querySelector('.period-rate');
      rate.textContent = `${done}/${total}`;
      rate.classList.toggle('full', pct === 100 && total > 0);
      el.querySelector('.mini-fill').style.width = pct + '%';
    }
  }

  function cssEscape(s) {
    return String(s).replace(/["\\]/g, '\\$&');
  }

  // ==================== 操作 ====================
  function addTask(key) {
    const data = state.data[key];
    if (!data) return;
    if (!Array.isArray(data.quests)) data.quests = [];

    const newId = 'n' + Date.now() + Math.random().toString(36).slice(2, 6);
    data.quests.push({ id: newId, text: '新任务', done: false });
    markDirty();
    renderContent();
    renderSidebar();

    // 聚焦新任务并全选
    requestAnimationFrame(() => {
      const el = document.querySelector(
        `.task-row[data-id="${cssEscape(newId)}"] .task-text`
      );
      if (!el) return;
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
  }

  let pendingDeleteTimer = null;
  function handleDeletePeriod(btn, key) {
    if (btn.dataset.confirm === '1') {
      clearTimeout(pendingDeleteTimer);
      delete state.data[key];
      // 非 quest 数据放回 unparsed 里，避免丢失
      markDirty();

      // 重新选一个
      const keys = Object.keys(state.data).filter(
        k => /^quest_(daily|weekly|monthly)_v4_/.test(k)
      );
      state.current = keys.length ? keys[0] : null;
      renderSidebar();
      renderContent();
      showToast('已删除该周期，记得点击保存', 'success');
      return;
    }
    btn.dataset.confirm = '1';
    const old = btn.textContent;
    btn.textContent = '再点一次确认删除';
    btn.style.color = 'var(--danger)';
    btn.style.borderColor = 'var(--danger)';
    pendingDeleteTimer = setTimeout(() => {
      if (!btn.isConnected) return;
      btn.dataset.confirm = '';
      btn.textContent = old;
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 3000);
  }

  // ==================== 保存 / 备份 ====================
  async function save() {
    if (!window.pywebview || !window.pywebview.api) {
      showToast('pywebview 未初始化', 'error');
      return;
    }

    // 组装 payload
    const payload = Object.assign({}, state.unparsed);
    for (const [key, val] of Object.entries(state.data)) {
      try {
        payload[key] = JSON.stringify(val);
      } catch (e) {
        showToast(`序列化失败 ${key}: ${e.message}`, 'error');
        return;
      }
    }

    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = '保存中…';

    try {
      const res = await window.pywebview.api.save_all(payload);
      if (res && res.error) {
        showToast('保存失败：' + res.error, 'error');
      } else {
        clearDirty();
        const backupName = res.backup ? res.backup.split(/[\\/]/).pop() : null;
        showToast(
          `已保存 ${res.count} 条记录` + (backupName ? `（备份：${backupName}）` : ''),
          'success'
        );
      }
    } catch (e) {
      showToast('保存异常：' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  async function backup() {
    if (!window.pywebview || !window.pywebview.api) return;
    try {
      const res = await window.pywebview.api.backup_now();
      if (res && res.error) {
        showToast('备份失败：' + res.error, 'error');
      } else {
        const name = res.path ? res.path.split(/[\\/]/).pop() : '备份文件';
        showToast('已备份到：' + name, 'success');
      }
    } catch (e) {
      showToast('备份异常：' + e.message, 'error');
    }
  }

  // ==================== 初始化 ====================
  async function init() {
    if (state.initialized) return;
    state.initialized = true;

    if (!window.pywebview || !window.pywebview.api) {
      document.getElementById('content').innerHTML =
        '<div class="empty">未检测到 pywebview，请通过 data_editor.py 启动</div>';
      return;
    }

    try {
      const res = await window.pywebview.api.load_all();
      if (res && res.error) {
        document.getElementById('fileInfo').textContent = res.error;
        document.getElementById('content').innerHTML =
          `<div class="empty">${res.error}</div>`;
        return;
      }

      document.getElementById('fileInfo').textContent = res.path || '';

      const raw = res.data || {};
      for (const [key, val] of Object.entries(raw)) {
        if (typeof val === 'string') {
          try {
            const parsed = JSON.parse(val);
            if (parsed && typeof parsed === 'object') {
              if (!Array.isArray(parsed.quests)) parsed.quests = [];
              parsed.quests = parsed.quests.map(q => ({
                id: q.id || ('x' + Math.random().toString(36).slice(2, 8)),
                text: String(q.text || ''),
                done: !!q.done,
              }));
              state.data[key] = parsed;
              continue;
            }
          } catch (e) { /* fallthrough */ }
        }
        // 解析失败或非字符串，保留原文
        state.unparsed[key] = val;
      }

      renderSidebar();

      const keys = Object.keys(state.data).filter(
        k => /^quest_(daily|weekly|monthly)_v4_/.test(k)
      );
      if (keys.length > 0) {
        // 默认选中最新的
        keys.sort((a, b) => {
          const ma = a.match(/^quest_(\w+)_v4_(.+)$/);
          const mb = b.match(/^quest_(\w+)_v4_(.+)$/);
          if (!ma || !mb) return 0;
          const va = periodSortValue(ma[1], ma[2]);
          const vb = periodSortValue(mb[1], mb[2]);
          return vb - va;
        });
        state.current = keys[0];
        renderSidebar();
        renderContent();
      } else {
        document.getElementById('content').innerHTML =
          '<div class="empty">没有找到可编辑的任务记录</div>';
      }
    } catch (e) {
      showToast('初始化失败：' + e.message, 'error');
    }
  }

  // ==================== 事件绑定 ====================
  document.getElementById('btnSave').onclick = save;
  document.getElementById('btnBackup').onclick = backup;

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      save();
    }
  });

  window.addEventListener('beforeunload', e => {
    if (state.dirty) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // pywebview 就绪后再初始化
  if (window.pywebview && window.pywebview.api) {
    init();
  } else {
    window.addEventListener('pywebviewready', init);
    // 兜底（避免个别平台不触发事件）
    setTimeout(init, 1200);
  }
})();
</script>
</body>
</html>
